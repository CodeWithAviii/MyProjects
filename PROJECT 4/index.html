<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="
    style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>
    <div class="profile">
        <div class="img">
            <img src="/PROJECT 4/profile.jpg.JPG" alt="">
        </div>

        <div class="text-data">
            <span class="name">Aviii</span>
            <span class="job">Student & Coder </span>
        </div>

        <div class="media-buttons">
            <a href="#" style="background-color: blue;" class="link">
                <i class='bx bxl-facebook'></i>
            </a>
            <a href="#" style="background-color: red;" class="link">
                <i class='bx bxl-youtube'></i>
            </a>
            <a href="#" style="background-color: rgb(233, 18, 154);" class="link">
                <i class='bx bxl-instagram'></i>
            </a>
            <a href="#" style="background-color: rgb(67, 67, 184);" class="link">
                <i class='bx bxl-twitter'></i>
            </a>
        </div>
        <div class="buttons">
            <button class="button">Subscribe</button>
            <button class="button">Message</button>
        </div>
        <div class="analytics">
            <div class="data">
                <i class='bx bx-heart'></i>
                <span class="number">
                    60k
                </span>
            </div>
            <div class="data">
                <i class='bx bx-message-rounded'></i>
                <span class="number">
                    12k
                </span>
            </div>
            <div class="data">
                <i class='bx bx-share'></i>
                <span class="number">
                    6.6k
                </span>
            </div>
        </div>
    </div>
</body>

</html>
